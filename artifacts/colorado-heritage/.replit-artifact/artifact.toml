kind = "web"
previewPath = "/"
title = "Colorado Heritage Website"
description = "The Colorado Heritage school website with a selected-staff content editor and server-rendered public pages."
version = "1.0.0"
id = "artifacts/colorado-heritage"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 23647

[services.development]
run = "pnpm --filter @workspace/colorado-heritage run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/colorado-heritage", "run", "build"]

[services.production.run]
args = ["node", "artifacts/colorado-heritage/server.mjs"]

[services.env]
PORT = "23647"
BASE_PATH = "/"
