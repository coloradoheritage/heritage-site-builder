openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /site-content:
    get:
      operationId: getSiteContent
      summary: Get all public website content
      responses:
        "200":
          description: Website content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContentState"
    put:
      operationId: saveSiteContent
      summary: Save website content as an approved editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteContentState"
      responses:
        "200":
          description: Saved website content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContentState"
        "409":
          description: Content changed since it was loaded
  /media/upload:
    post:
      operationId: uploadSitePhoto
      summary: Upload a compressed photo as an approved editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoUploadRequest"
      responses:
        "200":
          description: Stored image
          content:
            application/json:
              schema:
                type: object
                required: [url, alt]
                properties:
                  url:
                    type: string
                  alt:
                    type: string
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /homepage-content:
    get:
      operationId: getHomepageContent
      tags: [homepage]
      summary: Get saved homepage content
      description: Returns the shared homepage state, or null before the first save
      responses:
        "200":
          description: Homepage content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageContentResponse"
    put:
      operationId: saveHomepageContent
      tags: [homepage]
      summary: Save shared homepage content
      description: Saves the homepage state for all visitors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomepageContentState"
      responses:
        "200":
          description: Saved homepage content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageContentResponse"
  /editor-access:
    get:
      operationId: getEditorAccess
      tags: [homepage]
      summary: Check homepage editor access
      description: Returns whether the signed-in user is an approved homepage editor
      responses:
        "200":
          description: Editor access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorAccessResponse"
        "401":
          description: Sign-in required
        "403":
          description: Editor access required
components:
  schemas:
    PhotoUploadRequest:
      type: object
      required: [data, alt]
      properties:
        data: { type: string }
        alt: { type: string }
    CmsPage:
      type: object
      required: [path, label, title, description, markdown, kind]
      properties:
        path: { type: string }
        label: { type: string }
        title: { type: string }
        description: { type: string }
        markdown: { type: string }
        kind: { type: string }
        documentPath: { type: string }
        externalUrl: { type: string }
    CmsStaff:
      type: object
      required: [slug, name, role, photo, alt, bio]
      properties:
        slug: { type: string }
        name: { type: string }
        role: { type: string }
        administrative:
          type: boolean
          description: Include this person in the Administrative Staff directory.
        photo: { type: string }
        photoPositionX:
          type: number
          minimum: 0
          maximum: 100
          description: Horizontal photo position in percent; defaults to 50.
        photoPositionY:
          type: number
          minimum: 0
          maximum: 100
          description: Vertical photo position in percent; defaults to 0 to keep faces near the top visible.
        alt: { type: string }
        bio: { type: string }
    CmsArticle:
      type: object
      required: [path, title, date, markdown, archived]
      properties:
        path: { type: string }
        title: { type: string }
        date: { type: string }
        markdown: { type: string }
        archived: { type: boolean }
    CmsDocument:
      type: object
      required: [id, title, url]
      properties:
        id: { type: string }
        title: { type: string }
        url: { type: string }
    CmsNavigation:
      type: object
      required: [label, path, children]
      properties:
        label: { type: string }
        path: { type: string }
        children:
          type: array
          items: { type: string }
    SiteContentState:
      type: object
      required: [revision, pages, staff, events, news, documents, navigation]
      properties:
        revision: { type: integer }
        pages:
          type: array
          items: { $ref: "#/components/schemas/CmsPage" }
        staff:
          type: array
          items: { $ref: "#/components/schemas/CmsStaff" }
        events:
          type: array
          items: { $ref: "#/components/schemas/CmsArticle" }
        news:
          type: array
          items: { $ref: "#/components/schemas/CmsArticle" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/CmsDocument" }
        navigation:
          type: array
          items: { $ref: "#/components/schemas/CmsNavigation" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    HomepageSection:
      type: string
      enum:
        - donation
        - hero
        - programs
        - mission
        - anniversary
        - listen
        - stories
        - closing
    HomepageContentState:
      type: object
      properties:
        order:
          type: array
          items:
            $ref: "#/components/schemas/HomepageSection"
        hidden:
          type: array
          items:
            $ref: "#/components/schemas/HomepageSection"
        copy:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
      required: [order, hidden, copy]
    HomepageContentResponse:
      type: object
      properties:
        content:
          anyOf:
            - $ref: "#/components/schemas/HomepageContentState"
            - type: "null"
      required: [content]
    EditorAccessResponse:
      type: object
      properties:
        allowed:
          type: boolean
      required: [allowed]

